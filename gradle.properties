org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# KSP's task state is not configuration-cache serialisable (it fails writing
# `processorCP` on kspDebugKotlin), so the configuration cache stays off.
org.gradle.configuration-cache=false

# The Google Maven mirror can be slow from some networks; the defaults (30s/30s)
# abort large artifact downloads like room-compiler mid-transfer.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.incremental=true
