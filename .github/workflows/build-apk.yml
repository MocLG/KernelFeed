name: Build APK

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE", "LICENSING.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit tests"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      apk_name: ${{ steps.pack.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the long-removed "tools"
          # package, which makes sdkmanager fail. Name packages explicitly.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Optional stable signing key so new builds install over old ones.
      # Without the secret, each run gets a fresh debug key and Android will
      # refuse to update in place (uninstall first).
      - name: Install debug keystore (optional)
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p ~/.android
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using stable debug keystore from secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set: APK signature will change every build."
          fi

      - name: Unit tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify and package APK
        id: pack
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::Expected 1 APK, found ${#apks[@]}"; exit 1; }

          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose "${apks[0]}"
          "$bt/aapt" dump badging "${apks[0]}" | grep -E "^package:|sdkVersion|targetSdkVersion"

          ver="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          name="kernelfeed-${ver:-0}-${GITHUB_SHA::7}-debug.apk"
          mkdir -p dist
          cp "${apks[0]}" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kernelfeed-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build result"
            echo "- Tests: \`${{ steps.tests.outcome }}\` (non-blocking)"
            echo "- APK: \`${{ steps.pack.outputs.apk_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kernelfeed-debug
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="Debug-signed build of ${SHA::7}. Install with: adb install -r <apk>. Verify with the .sha256 file."
          if [ "$REF_TYPE" = "tag" ]; then
            gh release create "$REF_NAME" dist/* --repo "$REPO" --title "$REF_NAME" --notes "$notes" --verify-tag
          else
            # Rolling pre-release that always points at the latest build.
            gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
            gh release create nightly dist/* --repo "$REPO" --target "$SHA" \
              --title "Latest build (${SHA::7})" --notes "$notes" --prerelease
          fi
